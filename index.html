<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script Realm | Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b051a; --card-bg: #160b2e; --accent: #bc13fe;
            --accent-glow: rgba(188, 19, 254, 0.5); --text-main: #f0f0f0; --text-dim: #a0a0a0;
        }

        body {
            background-color: var(--bg); color: var(--text-main); font-family: 'Inter', sans-serif;
            margin: 0; padding: 0; line-height: 1.6;
            background-image: radial-gradient(circle at top, #1c0f3d 0%, var(--bg) 100%);
        }

        .header { text-align: center; padding: 30px 20px; }
        .logo { font-family: 'Orbitron', sans-serif; font-size: 2rem; color: #fff; text-shadow: 0 0 15px var(--accent-glow); letter-spacing: 3px; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }

        /* Form Styles */
        .glass-panel {
            background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px; border-radius: 12px; margin-bottom: 30px;
        }

        input, textarea {
            width: 100%; padding: 12px; background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1); color: white;
            border-radius: 8px; margin-bottom: 10px; box-sizing: border-box;
        }

        button.primary-btn {
            width: 100%; padding: 12px; background: var(--accent); color: white;
            border: none; border-radius: 8px; font-family: 'Orbitron', sans-serif;
            cursor: pointer; font-weight: bold;
        }

        /* Script Card Styles */
        .script-card {
            background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px; border-radius: 12px; margin-bottom: 15px;
        }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .script-title { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; margin: 0; color: #fff; }
        
        .copy-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--accent);
            color: var(--text-main); padding: 5px 10px; border-radius: 6px;
            cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 5px;
        }

        .script-desc { color: var(--text-dim); font-size: 0.85rem; margin: 8px 0; }

        /* The "See More" Code Block */
        .code-wrapper {
            margin-top: 10px; display: none; /* Hidden by default */
            background: #000; border-radius: 6px; padding: 10px;
            border: 1px solid #331452; overflow-x: auto;
        }

        pre { margin: 0; font-family: monospace; font-size: 12px; color: #bc13fe; white-space: pre-wrap; word-break: break-all; }

        .toggle-btn {
            background: transparent; border: none; color: var(--accent);
            cursor: pointer; font-size: 13px; padding: 5px 0;
            text-decoration: underline; font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="header"><h1 class="logo">SCRIPT REALM</h1></div>

    <div class="container">
        <div class="glass-panel">
            <input type="text" id="scriptName" placeholder="Title">
            <textarea id="scriptDesc" placeholder="Description"></textarea>
            <textarea id="scriptCode" placeholder="Paste Lua Code" style="height: 100px; font-family: monospace;"></textarea>
            <button class="primary-btn" onclick="uploadScript()">Publish</button>
        </div>

        <div id="feed">Loading scripts...</div>
    </div>

    <script>
        const supabaseUrl = 'https://pgzrmmrkgxefocxdcxli.supabase.co';
        const supabaseKey = 'sb_publishable_dwlWhrgvEF6ngaJ5I0OXZA_hQ0F_Gij'; 
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        async function uploadScript() {
            const name = document.getElementById('scriptName').value;
            const description = document.getElementById('scriptDesc').value;
            const code = document.getElementById('scriptCode').value;
            if(!name || !code) return alert("Title and Code required!");

            const { error } = await _supabase.from('scripts').insert([{ name, description, code }]);
            if (error) alert(error.message);
            else { location.reload(); }
        }

        async function loadScripts() {
            const { data, error } = await _supabase.from('scripts').select('*').order('created_at', { ascending: false });
            if (error) { document.getElementById('feed').innerText = "Error loading."; return; }

            const feed = document.getElementById('feed');
            feed.innerHTML = '';

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'script-card';
                card.innerHTML = `
                    <div class="card-header">
                        <h3 class="script-title">${item.name}</h3>
                        <button class="copy-btn" onclick="copyCode(this, \`${item.code.replace(/`/g, '\\`').replace(/\$/g, '\\$')}\`)">
                            📄 Copy
                        </button>
                    </div>
                    <p class="script-desc">${item.description || 'No description.'}</p>
                    <button class="toggle-btn" onclick="toggleCode(this)">See more...</button>
                    <div class="code-wrapper">
                        <pre><code>${item.code}</code></pre>
                    </div>
                `;
                feed.appendChild(card);
            });
        }

        function toggleCode(btn) {
            const wrapper = btn.nextElementSibling;
            if (wrapper.style.display === "block") {
                wrapper.style.display = "none";
                btn.innerText = "See more...";
            } else {
                wrapper.style.display = "block";
                btn.innerText = "Hide script";
            }
        }

        function copyCode(btn, code) {
            navigator.clipboard.writeText(code).then(() => {
                const originalText = btn.innerHTML;
                btn.innerHTML = "✅ Copied!";
                setTimeout(() => { btn.innerHTML = originalText; }, 2000);
            });
        }

        loadScripts();
    </script>
</body>
</html>
