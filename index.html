<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Script Realm</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#070311;
    --bg2:#130726;
    --card:#160b2f;
    --accent:#bc13fe;
    --accent2:#7f00ff;
    --text:#f2f2f2;
    --dim:#a0a0b8;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:
    radial-gradient(circle at top,#241046 0%,#12051f 35%,#070311 100%);
    color:var(--text);
    overflow-x:hidden;
    min-height:100vh;
}

/* PARTICLES */

.particles{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:-1;
}

.particle{
    position:absolute;
    width:2px;
    height:2px;
    background:#c76fff;
    border-radius:50%;
    opacity:.5;
    animation:float linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh);
    }
    to{
        transform:translateY(-100px);
    }
}

/* HEADER */

.header{
    text-align:center;
    padding:50px 20px 20px;
}

.logo{
    font-family:'Orbitron',sans-serif;
    font-size:3rem;
    letter-spacing:6px;
    color:white;
    text-shadow:
    0 0 10px #bc13fe,
    0 0 25px #bc13fe,
    0 0 50px rgba(188,19,254,.7);
}

.subtitle{
    color:var(--dim);
    margin-top:10px;
    font-size:.95rem;
}

/* CONTAINER */

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

/* GLASS */

.glass{
    background:rgba(22,11,47,.7);
    backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;
    box-shadow:
    0 0 25px rgba(188,19,254,.08),
    inset 0 0 20px rgba(255,255,255,.02);
}

/* FORM */

.upload-panel{
    padding:25px;
    margin-bottom:30px;
}

input,
textarea{
    width:100%;
    background:rgba(0,0,0,.25);
    border:1px solid rgba(255,255,255,.08);
    padding:14px;
    color:white;
    border-radius:12px;
    margin-bottom:12px;
    resize:none;
    transition:.25s;
    font-family:inherit;
}

textarea{
    min-height:120px;
}

input:focus,
textarea:focus{
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 15px rgba(188,19,254,.2);
}

/* BUTTON */

.primary-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    background:linear-gradient(90deg,var(--accent2),var(--accent));
    color:white;
    font-family:'Orbitron',sans-serif;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
    letter-spacing:1px;
}

.primary-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 0 20px rgba(188,19,254,.5);
}

/* SEARCH */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    gap:10px;
}

.search{
    flex:1;
}

.stats{
    color:var(--dim);
    font-size:.9rem;
}

/* CARD */

.script-card{
    padding:20px;
    margin-bottom:18px;
    transition:.3s;
    animation:fade .4s ease;
}

.script-card:hover{
    transform:translateY(-3px);
    border-color:rgba(188,19,254,.4);
    box-shadow:0 0 30px rgba(188,19,254,.15);
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.card-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.script-title{
    font-family:'Orbitron',sans-serif;
    font-size:1.1rem;
}

.script-desc{
    color:var(--dim);
    margin-top:10px;
    font-size:.92rem;
}

/* ACTIONS */

.actions{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.action-btn{
    background:rgba(255,255,255,.05);
    border:1px solid rgba(188,19,254,.35);
    color:white;
    padding:8px 14px;
    border-radius:10px;
    cursor:pointer;
    transition:.25s;
}

.action-btn:hover{
    background:rgba(188,19,254,.15);
}

/* CODE */

.code-wrapper{
    margin-top:15px;
    background:#05010d;
    border:1px solid #30114d;
    border-radius:14px;
    display:none;
    overflow:hidden;
}

.code-top{
    padding:10px 14px;
    border-bottom:1px solid rgba(255,255,255,.05);
    color:#d28dff;
    font-size:.85rem;
}

.code-wrapper pre{
    padding:16px;
    overflow:auto;
    color:#d786ff;
    font-size:.83rem;
    line-height:1.5;
}

/* MOBILE */

@media(max-width:700px){

.logo{
    font-size:2rem;
}

.topbar{
    flex-direction:column;
    align-items:stretch;
}

.card-header{
    flex-direction:column;
    align-items:flex-start;
}

.actions{
    width:100%;
}

.action-btn{
    flex:1;
}

}
</style>
</head>

<body>

<div class="particles" id="particles"></div>

<div class="header">
    <h1 class="logo">SCRIPT REALM</h1>
    <p class="subtitle">
        Upload • Share • Copy • Explore
    </p>
</div>

<div class="container">

    <div class="glass upload-panel">

        <input type="text" id="scriptName" placeholder="Script Title">

        <textarea id="scriptDesc" placeholder="Description"></textarea>

        <textarea
        id="scriptCode"
        placeholder="Paste your Lua script here..."
        style="font-family:monospace;"
        ></textarea>

        <button class="primary-btn" onclick="uploadScript()">
            PUBLISH SCRIPT
        </button>

    </div>

    <div class="topbar">

        <input
        class="search"
        id="searchInput"
        type="text"
        placeholder="Search scripts..."
        oninput="filterScripts()"
        >

        <div class="stats">
            <span id="scriptCount">0</span> Scripts
        </div>

    </div>

    <div id="feed"></div>

</div>

<script>

const supabaseUrl =
'https://pgzrmmrkgxefocxdcxli.supabase.co';

const supabaseKey =
'sb_publishable_dwlWhrgvEF6ngaJ5I0OXZA_hQ0F_Gij';

const _supabase =
supabase.createClient(supabaseUrl, supabaseKey);

let allScripts = [];

/* PARTICLES */

const particles = document.getElementById("particles");

for(let i=0;i<80;i++){

    const p = document.createElement("div");
    p.className = "particle";

    p.style.left = Math.random()*100+"%";
    p.style.animationDuration =
    (10 + Math.random()*20)+"s";

    p.style.opacity = Math.random();

    p.style.width =
    p.style.height =
    (1 + Math.random()*3)+"px";

    particles.appendChild(p);
}

/* UPLOAD */

async function uploadScript(){

    const name =
    document.getElementById('scriptName').value;

    const description =
    document.getElementById('scriptDesc').value;

    const code =
    document.getElementById('scriptCode').value;

    if(!name || !code){

        alert("Title and code required.");
        return;
    }

    const { error } =
    await _supabase
    .from('scripts')
    .insert([{ name, description, code }]);

    if(error){

        alert(error.message);

    }else{

        location.reload();
    }
}

/* LOAD */

async function loadScripts(){

    const { data, error } =
    await _supabase
    .from('scripts')
    .select('*')
    .order('created_at',{ ascending:false });

    if(error){

        document.getElementById('feed')
        .innerHTML = "Failed loading scripts.";

        return;
    }

    allScripts = data;

    renderScripts(data);
}

/* RENDER */

function renderScripts(data){

    const feed =
    document.getElementById('feed');

    document.getElementById('scriptCount')
    .innerText = data.length;

    feed.innerHTML = '';

    data.forEach(item => {

        const card =
        document.createElement('div');

        card.className =
        'script-card glass';

        card.innerHTML = `

        <div class="card-header">

            <h3 class="script-title">
                ${item.name}
            </h3>

        </div>

        <p class="script-desc">
            ${item.description || 'No description.'}
        </p>

        <div class="actions">

            <button class="action-btn copy-btn">
                📄 Copy
            </button>

            <button class="action-btn toggle-btn">
                👁 View
            </button>

        </div>

        <div class="code-wrapper">

            <div class="code-top">
                Lua Script
            </div>

            <pre></pre>

        </div>
        `;

        const pre =
        card.querySelector('pre');

        pre.textContent = item.code;

        const copyBtn =
        card.querySelector('.copy-btn');

        copyBtn.onclick = () => {

            navigator.clipboard.writeText(item.code);

            copyBtn.innerText = "✅ Copied";

            setTimeout(()=>{
                copyBtn.innerText = "📄 Copy";
            },2000);
        };

        const toggleBtn =
        card.querySelector('.toggle-btn');

        const wrapper =
        card.querySelector('.code-wrapper');

        toggleBtn.onclick = () => {

            if(wrapper.style.display === "block"){

                wrapper.style.display = "none";
                toggleBtn.innerText = "👁 View";

            }else{

                wrapper.style.display = "block";
                toggleBtn.innerText = "❌ Hide";
            }
        };

        feed.appendChild(card);
    });
}

/* SEARCH */

function filterScripts(){

    const query =
    document.getElementById('searchInput')
    .value
    .toLowerCase();

    const filtered =
    allScripts.filter(script =>

        script.name.toLowerCase().includes(query) ||

        (script.description || '')
        .toLowerCase()
        .includes(query)
    );

    renderScripts(filtered);
}

loadScripts();

</script>

</body>
</html>
